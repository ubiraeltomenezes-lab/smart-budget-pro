<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Budget Pro - V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #eef2ff;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text-main); padding: 20px 20px 120px 20px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 480px; }

        .header-area { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
        #mes-atual-topo { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }

        .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); margin-bottom: 20px; }
        
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h3 { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; }
        .badge-dia { background: var(--primary-light); color: var(--primary); padding: 4px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 800; }

        /* Categorias Rápidas */
        .categorias-rapidas {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scroll-behavior: smooth;
        }
        .categorias-rapidas::-webkit-scrollbar { height: 4px; }
        .categorias-rapidas::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .btn-categoria {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-categoria:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-categoria:active {
            transform: scale(0.95);
        }

        input { width: 100%; padding: 14px; border: 1.5px solid #e2e8f0; border-radius: 14px; font-size: 1rem; outline: none; background: #fff; margin-bottom: 12px; }
        input:focus { border-color: var(--primary); }

        .btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 1rem; }
        #btn-voz { background: var(--warning); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        #btn-voz.escutando { background: var(--danger); animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #lista { max-height: 320px; overflow-y: auto; padding-right: 5px; }
        #lista::-webkit-scrollbar { width: 4px; }
        #lista::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        .gasto-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-radius: 18px; background: #f8fafc; margin-bottom: 10px; border: 1px solid #f1f5f9; }
        .gasto-info { display: flex; flex-direction: column; }
        .gasto-label-dia { font-size: 0.65rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .gasto-desc { font-weight: 600; color: var(--text-main); font-size: 1rem; line-height: 1.2; text-transform: capitalize; }
        .gasto-valor { font-weight: 800; color: var(--primary); font-size: 0.95rem; margin-top: 2px; }

        .progress-container { background: #e2e8f0; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--success); height: 100%; width: 0%; transition: 0.8s; }

        .btn-del { color: #cbd5e1; background: none; border: none; font-size: 1.4rem; cursor: pointer; padding: 10px; }

        .btn-limpar-hist { background: #fee2e2; color: var(--danger); border: none; padding: 10px; border-radius: 12px; width: 100%; font-weight: 800; font-size: 0.7rem; cursor: pointer; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .nav-tabs { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 15px 15px 30px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 1000; }
        .tab-item { cursor: pointer; color: var(--text-muted); font-size: 0.7rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tab-item.active { color: var(--primary); }
        .content-section { display: none; }
        .content-section.active { display: block; }

        .meta-container { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); }
        .meta-edit { display: flex; align-items: center; gap: 5px; }
        .meta-edit input { width: 70px; padding: 4px 8px; margin: 0; font-size: 0.75rem; font-weight: 800; border: 1px solid #e2e8f0; border-radius: 6px; text-align: right; }

        /* Estilos adicionados para agrupamento por semana */
        .semana-bloco {
            background: #f8fafc;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 18px;
            border: 1px solid #e2e8f0;
        }
        .semana-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .semana-titulo {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
        }
        .semana-total {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header-area">
            <h1>Smart Budget</h1>
            <div id="mes-atual-topo">...</div>
        </div>

        <!-- ABA REGISTRO / INÍCIO -->
        <section id="aba-registro" class="content-section active">
            <div class="card">
                <div class="card-header-flex">
                    <h3>Novo Gasto</h3>
                    <span class="badge-dia" id="dia-semana-topo">...</span>
                </div>

                <!-- Botões de tags/categorias rápidas -->
                <div class="categorias-rapidas">
                    <button class="btn-categoria" onclick="selecionarCategoria('🛒 Mercado')">🛒 Mercado</button>
                    <button class="btn-categoria" onclick="selecionarCategoria('🥖 Padaria')">🥖 Padaria</button>
                    <button class="btn-categoria" onclick="selecionarCategoria('🍔 iFood')">🍔 iFood</button>
                    <button class="btn-categoria" onclick="selecionarCategoria('🚗 Uber')">🚗 Uber</button>
                    <button class="btn-categoria" onclick="selecionarCategoria('👤 Ana')">👤 Ana</button>
                    <button class="btn-categoria" onclick="selecionarCategoria('💛 Doação')">💛 Doação</button>
                    <button class="btn-categoria" onclick="selecionarCategoria('🎉 Lazer')">🎉 Lazer</button>
                </div>

                <input type="text" id="desc" placeholder="O que você comprou?">
                <input type="number" id="valor" placeholder="R$ 0,00" inputmode="decimal">
                
                <button id="btn-voz" class="btn">🎤 Falar Gasto</button>
                <button class="btn" onclick="adicionarGasto()">Salvar Gasto</button>
            </div>

            <div class="card">
                <div class="meta-container">
                    <h3>Gastos Recentes</h3>
                    <div class="meta-edit">
                        <span>LIMITE: R$</span>
                        <input type="number" id="meta-valor" value="1000" onchange="atualizarInterface()">
                    </div>
                </div>
                <div class="progress-container"><div id="progresso" class="progress-bar"></div></div>
                <div id="lista"></div>
                <div style="display:flex; justify-content: space-between; font-weight:800; margin-top:15px; padding-top:15px; border-top:1px solid #eee;">
                    <span>Total Acumulado</span>
                    <span id="soma" style="color:var(--primary)">R$ 0,00</span>
                </div>
            </div>
        </section>

        <!-- ABA HISTÓRICO -->
        <section id="aba-historico" class="content-section">
            <div class="card">
                <h3 style="margin-bottom: 20px;">Resumo Semanal por Tag</h3>
                <button class="btn-limpar-hist" onclick="limparTudo()">🗑️ Limpar Todo Histórico</button>
                <div id="historico-semanal"></div>
            </div>
        </section>

        <!-- NAVEGAÇÃO -->
        <nav class="nav-tabs">
            <div class="tab-item active" onclick="mudarAba('aba-registro', this)"><span>🏠</span><span>INÍCIO</span></div>
            <div class="tab-item" onclick="mudarAba('aba-historico', this)"><span>📊</span><span>HISTÓRICO</span></div>
        </nav>
    </div>

    <script>
        let gastos = JSON.parse(localStorage.getItem('gastos')) || [];
        let metaSalva = localStorage.getItem('meta-orcamento') || "1000";
        document.getElementById('meta-valor').value = metaSalva;

        const diasSemana = [ "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo" ];

        // Selecionar botão de tag
        function selecionarCategoria(nome) {
            const descInput = document.getElementById('desc');
            const valorInput = document.getElementById('valor');
            
            descInput.value = nome;
            valorInput.focus();
        }

        function mudarAba(id, el) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id === 'aba-historico') renderizarHistoricoAgrupado();
        }

        function adicionarGasto() {
            const v = document.getElementById('valor');
            const d = document.getElementById('desc');
            if (!v.value) return;

            const agora = new Date();
            const novo = {
                id: Date.now(),
                data: agora.toLocaleDateString('pt-BR'),
                diaNome: diasSemana[agora.getDay()],
                valor: parseFloat(v.value),
                desc: d.value.trim() || "Outros",
                timestamp: agora.getTime()
            };

            gastos.unshift(novo);
            v.value = ''; d.value = '';
            atualizarInterface();
        }

        function excluirGasto(id) {
            gastos = gastos.filter(g => g.id !== id);
            atualizarInterface();
        }

        function limparTudo() {
            if(confirm("Isso apagará todos os gastos salvos. Deseja continuar?")) {
                gastos = [];
                localStorage.setItem('gastos', JSON.stringify(gastos));
                atualizarInterface();
                renderizarHistoricoAgrupado();
            }
        }

        function atualizarInterface() {
            const lista = document.getElementById('lista');
            const metaInput = document.getElementById('meta-valor');
            let totalGeral = 0;
            
            lista.innerHTML = '';
            localStorage.setItem('meta-orcamento', metaInput.value);

            gastos.forEach(g => {
                totalGeral += g.valor;
                lista.innerHTML += `
                    <div class="gasto-item">
                        <div class="gasto-info">
                            <span class="gasto-label-dia">${g.diaNome} - ${g.data}</span>
                            <span class="gasto-desc">${g.desc}</span>
                            <span class="gasto-valor">R$ ${g.valor.toFixed(2)}</span>
                        </div>
                        <button class="btn-del" onclick="excluirGasto(${g.id})">&times;</button>
                    </div>`;
            });

            document.getElementById('soma').innerText = `R$ ${totalGeral.toFixed(2)}`;
            
            const meta = parseFloat(metaInput.value) || 1;
            const perc = Math.min((totalGeral / meta) * 100, 100);
            const barra = document.getElementById('progresso');
            barra.style.width = perc + '%';
            barra.style.background = totalGeral > meta ? 'var(--danger)' : 'var(--success)';

            localStorage.setItem('gastos', JSON.stringify(gastos));
        }

        // Retorna o intervalo da semana (Domingo a Sábado) para um timestamp
        function obterIntervaloSemana(timestamp) {
            const data = new Date(timestamp);
            const diaSemana = data.getDay(); // 0 = Domingo, 6 = Sábado
            
            const inicio = new Date(data);
            inicio.setDate(data.getDate() - diaSemana);
            
            const fim = new Date(inicio);
            fim.setDate(inicio.getDate() + 6);

            const formatar = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
            return `Semana (${formatar(inicio)} a ${formatar(fim)})`;
        }

        // AGRUPA OS VALORES DAS TAGS POR SEMANA NO HISTÓRICO
        function renderizarHistoricoAgrupado() {
            const container = document.getElementById('historico-semanal');
            container.innerHTML = '';
            
            if (gastos.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.88rem; margin-top:20px;">Nenhum gasto registrado ainda.</p>';
                return;
            }

            // Agrupa primeiro por Semana e depois por Categoria/Tag
            const semanas = {};

            gastos.forEach(g => {
                const rotuloSemana = obterIntervaloSemana(g.timestamp || g.id);
                const tag = g.desc;

                if (!semanas[rotuloSemana]) {
                    semanas[rotuloSemana] = {
                        totalSemana: 0,
                        categorias: {}
                    };
                }

                if (!semanas[rotuloSemana].categorias[tag]) {
                    semanas[rotuloSemana].categorias[tag] = { total: 0, qtd: 0 };
                }

                semanas[rotuloSemana].totalSemana += g.valor;
                semanas[rotuloSemana].categorias[tag].total += g.valor;
                semanas[rotuloSemana].categorias[tag].qtd += 1;
            });

            // Renderiza cada grupo semanal
            for (const rotuloSemana in semanas) {
                const dadosSemana = semanas[rotuloSemana];

                let htmlCategorias = '';
                for (const tag in dadosSemana.categorias) {
                    const cat = dadosSemana.categorias[tag];
                    htmlCategorias += `
                        <div class="gasto-item" style="background:#fff; margin-bottom:8px;">
                            <div class="gasto-info">
                                <span class="gasto-desc">${tag}</span>
                                <span class="gasto-label-dia">${cat.qtd} lançamento(s)</span>
                            </div>
                            <span class="gasto-valor" style="font-size:1.0rem; color:var(--primary);">R$ ${cat.total.toFixed(2)}</span>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="semana-bloco">
                        <div class="semana-header">
                            <span class="semana-titulo">📅 ${rotuloSemana}</span>
                            <span class="semana-total">Total: R$ ${dadosSemana.totalSemana.toFixed(2)}</span>
                        </div>
                        ${htmlCategorias}
                    </div>
                `;
            }
        }

        // ================= RECONHECIMENTO DE VOZ =================
        const btnVoz = document.getElementById('btn-voz');
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            btnVoz.addEventListener('click', () => {
                if (btnVoz.classList.contains('escutando')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                btnVoz.classList.add('escutando');
                btnVoz.innerHTML = '🛑 Ouvindo... Fale algo como "Mercado 50 reais"';
            };

            recognition.onend = () => {
                btnVoz.classList.remove('escutando');
                btnVoz.innerHTML = '🎤 Falar Gasto';
            };

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript.toLowerCase();
                processarVoz(texto);
            };

            recognition.onerror = (event) => {
                console.error("Erro no reconhecimento de voz: ", event.error);
                alert("Não consegui te ouvir direito. Tente novamente!");
            };
        } else {
            btnVoz.style.display = 'none';
        }

        function processarVoz(frase) {
            const regexNumero = /([\d.,]+)/g;
            const numerosEncontrados = frase.match(regexNumero);

            if (!numerosEncontrados) {
                alert("Diga a descrição e o valor. Exemplo: 'Padaria 12 reais'");
                return;
            }

            let valorTexto = numerosEncontrados[numerosEncontrados.length - 1];
            valorTexto = valorTexto.replace('.', '').replace(',', '.');
            const valorDecimal = parseFloat(valorTexto);

            if (isNaN(valorDecimal)) {
                alert("Não consegui entender o valor. Tente dizer 'R$ 20' ou '50 reais'");
                return;
            }

            let descricao = frase
                .replace(numerosEncontrados[numerosEncontrados.length - 1], '')
                .replace(/reais|real|r\$/g, '')
                .replace(/\b(de|da|com|em|no|na)\b/g, '')
                .trim();

            descricao = descricao.charAt(0).toUpperCase() + descricao.slice(1);

            document.getElementById('desc').value = descricao || "Gasto por Voz";
            document.getElementById('valor').value = valorDecimal.toFixed(2);
            
            adicionarGasto();
        }

        // Inicialização
        const dataHoje = new Date();
        document.getElementById('dia-semana-topo').innerText = diasSemana[dataHoje.getDay()];
        const mesAno = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(dataHoje);
        document.getElementById('mes-atual-topo').innerText = mesAno;
        atualizarInterface();
    </script>
</body>
</html>
