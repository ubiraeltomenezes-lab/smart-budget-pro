<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Budget Pro - Offline Version</title>
    
    <!-- Metas para funcionamento como aplicativo Offline -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6366f1">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #eef2ff;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        /* Usando fontes nativas do sistema para funcionar 100% sem internet */
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        body { background: var(--bg); color: var(--text-main); padding: 20px 20px 120px 20px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 480px; }

        .header-area { text-align: center; margin-bottom: 20px; position: relative; }
        h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 3px; }
        #mes-atual-topo { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }

        .status-conexao {
            display: inline-block;
            margin-top: 6px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .status-online { background: #dcfce7; color: #15803d; }
        .status-offline { background: #fee2e2; color: #b91c1c; }

        .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); margin-bottom: 20px; }
        
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h3 { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; }
        .badge-dia { background: var(--primary-light); color: var(--primary); padding: 4px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 800; }

        /* Categorias Rápidas */
        .categorias-rapidas {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scroll-behavior: smooth;
        }
        .categorias-rapidas::-webkit-scrollbar { height: 4px; }
        .categorias-rapidas::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .btn-categoria {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-categoria:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            border: 1.5px solid #e2e8f0; 
            border-radius: 14px; 
            font-size: 1rem; 
            outline: none; 
            background: #fff; 
            margin-bottom: 12px; 
            color: var(--text-main);
        }
        input:focus, select:focus { border-color: var(--primary); }

        .btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 1rem; }
        .btn-secundario { background: #f1f5f9; color: var(--text-main); border: 1px solid #cbd5e1; }
        
        #btn-voz { background: var(--warning); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        #btn-voz.escutando { background: var(--danger); animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #lista { max-height: 320px; overflow-y: auto; padding-right: 5px; }
        #lista::-webkit-scrollbar { width: 4px; }
        #lista::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        .gasto-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px; 
            border-radius: 18px; 
            background: #f8fafc; 
            margin-bottom: 10px; 
            border: 1px solid #f1f5f9; 
        }
        .gasto-info { display: flex; flex-direction: column; flex-grow: 1; }
        .gasto-label-dia { font-size: 0.65rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .gasto-desc { font-weight: 600; color: var(--text-main); font-size: 0.95rem; line-height: 1.2; text-transform: capitalize; }
        .gasto-valor { font-weight: 800; color: var(--primary); font-size: 0.95rem; margin-top: 2px; }

        .acoes-item { display: flex; gap: 4px; align-items: center; }
        .btn-acao { color: #94a3b8; background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 6px; border-radius: 8px; }
        .btn-acao:hover { background: #e2e8f0; color: var(--text-main); }

        .progress-container { background: #e2e8f0; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--success); height: 100%; width: 0%; transition: 0.8s; }

        .btn-limpar-hist { background: #fee2e2; color: var(--danger); border: none; padding: 10px; border-radius: 12px; width: 100%; font-weight: 800; font-size: 0.7rem; cursor: pointer; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .nav-tabs { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 15px 15px 30px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 1000; }
        .tab-item { cursor: pointer; color: var(--text-muted); font-size: 0.7rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tab-item.active { color: var(--primary); }
        .content-section { display: none; }
        .content-section.active { display: block; }

        .meta-container { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); }
        .meta-edit { display: flex; align-items: center; gap: 5px; }
        .meta-edit input { width: 70px; padding: 4px 8px; margin: 0; font-size: 0.75rem; font-weight: 800; border: 1px solid #e2e8f0; border-radius: 6px; text-align: right; }

        /* Estilos do Histórico */
        .semana-bloco { background: #f8fafc; border-radius: 16px; padding: 15px; border: 1px solid #e2e8f0; margin-top: 15px; }
        .categoria-expansivel { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 8px; overflow: hidden; }
        .categoria-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .categoria-detalhes { display: none; padding: 10px 12px; background: #fafafa; border-top: 1px dashed #e2e8f0; font-size: 0.85rem; }
        .categoria-detalhes.aberto { display: block; }
        .detalhe-linha { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--text-muted); }
        .detalhe-linha:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header-area">
            <h1>Smart Budget</h1>
            <div id="mes-atual-topo">...</div>
            <div id="status-conexao" class="status-conexao status-online">🟢 Online</div>
        </div>

        <!-- ABA REGISTRO / INÍCIO -->
        <section id="aba-registro" class="content-section active">
            <div class="card">
                <div class="card-header-flex">
                    <h3 id="form-titulo">Novo Gasto</h3>
                    <span class="badge-dia" id="dia-semana-topo">...</span>
                </div>

                <!-- Botões de tags/categorias rápidas -->
                <div class="categorias-rapidas">
                    <button class="btn-categoria" type="button" onclick="selecionarCategoria('🛒 Mercado')">🛒 Mercado</button>
                    <button class="btn-categoria" type="button" onclick="selecionarCategoria('🥖 Padaria')">🥖 Padaria</button>
                    <button class="btn-categoria" type="button" onclick="selecionarCategoria('🍔 iFood')">🍔 iFood</button>
                    <button class="btn-categoria" type="button" onclick="selecionarCategoria('🚗 Uber')">🚗 Uber</button>
                    <button class="btn-categoria" type="button" onclick="selecionarCategoria('👤 Ana')">👤 Ana</button>
                    <button class="btn-categoria" type="button" onclick="selecionarCategoria('💛 Doação')">💛 Doação</button>
                    <button class="btn-categoria" type="button" onclick="selecionarCategoria('🎉 Lazer')">🎉 Lazer</button>
                </div>

                <input type="text" id="desc" placeholder="O que você comprou?">
                <input type="number" id="valor" placeholder="R$ 0,00" inputmode="decimal">
                
                <button id="btn-voz" type="button" class="btn">🎤 Falar Gasto</button>
                <button class="btn" type="button" id="btn-salvar" onclick="adicionarOuAtualizarGasto()">Salvar Gasto</button>
                <button class="btn btn-secundario" type="button" id="btn-cancelar-edit" onclick="cancelarEdicao()" style="display:none; margin-top:6px;">Cancelar Edição</button>
            </div>

            <div class="card">
                <div class="meta-container">
                    <h3>Gastos Recentes</h3>
                    <div class="meta-edit">
                        <span>LIMITE: R$</span>
                        <input type="number" id="meta-valor" value="1000" onchange="atualizarInterface()">
                    </div>
                </div>
                <div class="progress-container"><div id="progresso" class="progress-bar"></div></div>
                <div id="lista"></div>
                <div style="display:flex; justify-content: space-between; font-weight:800; margin-top:15px; padding-top:15px; border-top:1px solid #eee;">
                    <span>Total Acumulado</span>
                    <span id="soma" style="color:var(--primary)">R$ 0,00</span>
                </div>
            </div>
        </section>

        <!-- ABA HISTÓRICO -->
        <section id="aba-historico" class="content-section">
            <div class="card">
                <h3 style="margin-bottom: 15px;">Filtrar Histórico</h3>
                
                <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">SELECIONE A SEMANA:</label>
                <select id="seletor-semana" onchange="renderizarHistoricoFiltrado()" style="margin-top: 5px;">
                    <!-- Preenchido via JS -->
                </select>

                <div id="historico-semanal"></div>

                <div style="margin-top: 25px; display: flex; flex-direction: column; gap: 8px;">
                    <button class="btn btn-secundario" type="button" onclick="exportarCSV()" style="font-size:0.8rem; padding:10px;">📊 Exportar para Excel (.CSV)</button>
                    <button class="btn-limpar-hist" type="button" onclick="limparTudo()">🗑️ Limpar Todo Histórico</button>
                </div>
            </div>
        </section>

        <!-- NAVEGAÇÃO -->
        <nav class="nav-tabs">
            <div class="tab-item active" onclick="mudarAba('aba-registro', this)"><span>🏠</span><span>INÍCIO</span></div>
            <div class="tab-item" onclick="mudarAba('aba-historico', this)"><span>📊</span><span>HISTÓRICO</span></div>
        </nav>
    </div>

    <script>
        // Leitura de dados salvos localmente
        let gastos = [];
        try {
            gastos = JSON.parse(localStorage.getItem('gastos')) || [];
        } catch (e) {
            gastos = [];
        }

        let metaSalva = localStorage.getItem('meta-orcamento') || "1000";
        let idGastoEmEdicao = null;

        document.getElementById('meta-valor').value = metaSalva;
        const diasSemana = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

        function atualizarStatusConexao() {
            const badge = document.getElementById('status-conexao');
            if (navigator.onLine) {
                badge.innerText = '🟢 Online';
                badge.className = 'status-conexao status-online';
            } else {
                badge.innerText = '🔴 Offline (Modo Local)';
                badge.className = 'status-conexao status-offline';
            }
        }

        window.addEventListener('online', atualizarStatusConexao);
        window.addEventListener('offline', atualizarStatusConexao);

        function selecionarCategoria(nome) {
            document.getElementById('desc').value = nome;
            document.getElementById('valor').focus();
        }

        function mudarAba(id, el) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id === 'aba-historico') carregarOpcoesSemanas();
        }

        function adicionarOuAtualizarGasto() {
            const v = document.getElementById('valor');
            const d = document.getElementById('desc');
            
            if (!v.value || isNaN(parseFloat(v.value))) {
                alert("Por favor, digite um valor válido.");
                return;
            }

            if (idGastoEmEdicao) {
                gastos = gastos.map(g => {
                    if (g.id === idGastoEmEdicao) {
                        return { ...g, valor: parseFloat(v.value), desc: d.value.trim() || "Outros" };
                    }
                    return g;
                });
                cancelarEdicao();
            } else {
                const agora = new Date();
                const novo = {
                    id: Date.now(),
                    data: agora.toLocaleDateString('pt-BR'),
                    diaNome: diasSemana[agora.getDay()],
                    valor: parseFloat(v.value),
                    desc: d.value.trim() || "Outros",
                    timestamp: agora.getTime()
                };
                gastos.unshift(novo);
            }

            v.value = ''; d.value = '';
            atualizarInterface();
        }

        function prepararEdicao(id) {
            const gasto = gastos.find(g => g.id === id);
            if (!gasto) return;

            idGastoEmEdicao = id;
            document.getElementById('desc').value = gasto.desc;
            document.getElementById('valor').value = gasto.valor;
            
            document.getElementById('form-titulo').innerText = "Editar Gasto";
            document.getElementById('btn-salvar').innerText = "Atualizar Gasto";
            document.getElementById('btn-cancelar-edit').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            idGastoEmEdicao = null;
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('form-titulo').innerText = "Novo Gasto";
            document.getElementById('btn-salvar').innerText = "Salvar Gasto";
            document.getElementById('btn-cancelar-edit').style.display = "none";
        }

        function excluirGasto(id) {
            gastos = gastos.filter(g => g.id !== id);
            atualizarInterface();
        }

        function limparTudo() {
            if(confirm("Isso apagará todos os gastos salvos permanentemente. Deseja continuar?")) {
                gastos = [];
                localStorage.setItem('gastos', JSON.stringify(gastos));
                atualizarInterface();
                carregarOpcoesSemanas();
            }
        }

        function atualizarInterface() {
            const lista = document.getElementById('lista');
            const metaInput = document.getElementById('meta-valor');
            let totalGeral = 0;
            
            lista.innerHTML = '';
            localStorage.setItem('meta-orcamento', metaInput.value);

            gastos.forEach(g => {
                totalGeral += g.valor;
                lista.innerHTML += `
                    <div class="gasto-item">
                        <div class="gasto-info">
                            <span class="gasto-label-dia">${g.diaNome} - ${g.data}</span>
                            <span class="gasto-desc">${g.desc}</span>
                            <span class="gasto-valor">R$ ${g.valor.toFixed(2)}</span>
                        </div>
                        <div class="acoes-item">
                            <button class="btn-acao" type="button" onclick="prepararEdicao(${g.id})" title="Editar">✏️</button>
                            <button class="btn-acao" type="button" onclick="excluirGasto(${g.id})" title="Excluir">&times;</button>
                        </div>
                    </div>`;
            });

            document.getElementById('soma').innerText = `R$ ${totalGeral.toFixed(2)}`;
            
            const meta = parseFloat(metaInput.value) || 1;
            const perc = Math.min((totalGeral / meta) * 100, 100);
            const barra = document.getElementById('progresso');
            barra.style.width = perc + '%';
            barra.style.background = totalGeral > meta ? 'var(--danger)' : 'var(--success)';

            try {
                localStorage.setItem('gastos', JSON.stringify(gastos));
            } catch (e) {
                console.error("Erro ao salvar no dispositivo:", e);
            }
        }

        function obterIntervaloSemana(timestamp) {
            const data = new Date(timestamp);
            const diaSemana = data.getDay(); // 0 = Dom, 1 = Seg, ..., 6 = Sab
            const diasAteSegunda = diaSemana === 0 ? 6 : diaSemana - 1;
            
            const inicioSegunda = new Date(data);
            inicioSegunda.setDate(data.getDate() - diasAteSegunda);
            
            const fimDomingo = new Date(inicioSegunda);
            fimDomingo.setDate(inicioSegunda.getDate() + 6);

            const formatar = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
            return `Semana (${formatar(inicioSegunda)} a ${formatar(fimDomingo)})`;
        }

        function carregarOpcoesSemanas() {
            const seletor = document.getElementById('seletor-semana');
            seletor.innerHTML = '';

            if (gastos.length === 0) {
                seletor.innerHTML = '<option value="">Nenhum dado registrado</option>';
                renderizarHistoricoFiltrado();
                return;
            }

            const semanasUnicas = [...new Set(gastos.map(g => obterIntervaloSemana(g.timestamp || g.id)))];

            semanasUnicas.forEach(semana => {
                seletor.innerHTML += `<option value="${semana}">${semana}</option>`;
            });

            renderizarHistoricoFiltrado();
        }

        function renderizarHistoricoFiltrado() {
            const container = document.getElementById('historico-semanal');
            const semanaSelecionada = document.getElementById('seletor-semana').value;
            container.innerHTML = '';

            if (!semanaSelecionada || gastos.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.88rem; margin-top:20px;">Nenhum gasto nesta semana.</p>';
                return;
            }

            const gastosDaSemana = gastos.filter(g => obterIntervaloSemana(g.timestamp || g.id) === semanaSelecionada);
            const categorias = {};
            let totalSemana = 0;

            gastosDaSemana.forEach(g => {
                totalSemana += g.valor;
                if (!categorias[g.desc]) {
                    categorias[g.desc] = { total: 0, itens: [] };
                }
                categorias[g.desc].total += g.valor;
                categorias[g.desc].itens.push(g);
            });

            let htmlCategorias = '';
            let index = 0;

            for (const tag in categorias) {
                index++;
                const cat = categorias[tag];
                
                let htmlItensDetalhados = cat.itens.map(item => `
                    <div class="detalhe-linha">
                        <span>${item.diaNome} (${item.data})</span>
                        <span style="font-weight:600; color:var(--text-main);">R$ ${item.valor.toFixed(2)}</span>
                    </div>
                `).join('');

                htmlCategorias += `
                    <div class="categoria-expansivel">
                        <div class="categoria-header" onclick="alternarDetalhes('detalhe-${index}')">
                            <div>
                                <strong style="font-size:0.9rem;">${tag}</strong>
                                <span style="font-size:0.75rem; color:var(--text-muted); display:block;">${cat.itens.length} compra(s)</span>
                            </div>
                            <span style="font-weight:800; color:var(--primary);">R$ ${cat.total.toFixed(2)} ▾</span>
                        </div>
                        <div id="detalhe-${index}" class="categoria-detalhes">
                            ${htmlItensDetalhados}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="semana-bloco">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="font-size:0.8rem; font-weight:800; color:var(--text-muted);">TOTAL DA SEMANA</span>
                        <span style="font-size:1.1rem; font-weight:800; color:var(--primary);">R$ ${totalSemana.toFixed(2)}</span>
                    </div>
                    ${htmlCategorias}
                </div>
            `;
        }

        function alternarDetalhes(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('aberto');
        }

        function exportarCSV() {
            if (gastos.length === 0) {
                alert("Não há dados para exportar!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Data;Dia;Descricao;Valor (R$)\n";
            gastos.forEach(g => {
                csvContent += `${g.data};${g.diaNome};${g.desc};${g.valor.toFixed(2).replace('.', ',')}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `smart_budget_gastos_${new Date().toLocaleDateString('pt-BR')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ================= RECONHECIMENTO DE VOZ (Requer Conexão) =================
        const btnVoz = document.getElementById('btn-voz');
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            btnVoz.addEventListener('click', () => {
                if (!navigator.onLine) {
                    alert("A função de voz precisa de internet para processar o áudio. Por favor, digite o valor no campo manual.");
                    return;
                }
                if (btnVoz.classList.contains('escutando')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                btnVoz.classList.add('escutando');
                btnVoz.innerHTML = '🛑 Ouvindo... Fale algo como "Mercado 50 reais"';
            };

            recognition.onend = () => {
                btnVoz.classList.remove('escutando');
                btnVoz.innerHTML = '🎤 Falar Gasto';
            };

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript.toLowerCase();
                processarVoz(texto);
            };

            recognition.onerror = (event) => {
                alert("Não consegui te ouvir direito. Tente novamente!");
            };
        } else {
            btnVoz.style.display = 'none';
        }

        function processarVoz(frase) {
            const regexNumero = /([\d.,]+)/g;
            const numerosEncontrados = frase.match(regexNumero);

            if (!numerosEncontrados) {
                alert("Diga a descrição e o valor. Exemplo: 'Padaria 12 reais'");
                return;
            }

            let valorTexto = numerosEncontrados[numerosEncontrados.length - 1];
            valorTexto = valorTexto.replace('.', '').replace(',', '.');
            const valorDecimal = parseFloat(valorTexto);

            if (isNaN(valorDecimal)) {
                alert("Não consegui entender o valor.");
                return;
            }

            let descricao = frase
                .replace(numerosEncontrados[numerosEncontrados.length - 1], '')
                .replace(/reais|real|r\$/g, '')
                .replace(/\b(de|da|com|em|no|na)\b/g, '')
                .trim();

            descricao = descricao.charAt(0).toUpperCase() + descricao.slice(1);

            document.getElementById('desc').value = descricao || "Gasto por Voz";
            document.getElementById('valor').value = valorDecimal.toFixed(2);
            
            adicionarOuAtualizarGasto();
        }

        // Inicialização
        const dataHoje = new Date();
        document.getElementById('dia-semana-topo').innerText = diasSemana[dataHoje.getDay()];
        const mesAno = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(dataHoje);
        document.getElementById('mes-atual-topo').innerText = mesAno;
        
        atualizarStatusConexao();
        atualizarInterface();
    </script>
</body>
</html>
